<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知舆 · 企业版</title>
<link rel="stylesheet" href="/web/shared/css/theme.css">
<link rel="stylesheet" href="/web/shared/css/components.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  .app-layout { display: flex; height: 100vh; }
  .sidebar {
    width: 240px; min-width: 240px; background: rgba(10, 15, 40, 0.9);
    border-right: 1px solid var(--card-border); padding: 20px 0;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid var(--card-border); margin-bottom: 12px; }
  .sidebar-header h2 { font-size: 20px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sidebar-section { padding: 8px 20px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .nav-item {
    padding: 10px 20px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; color: var(--text-dim); transition: var(--transition);
    font-size: 14px; border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--accent-purple); background: rgba(139,92,246,0.08); border-left-color: var(--accent-purple); }
  .nav-item i { width: 18px; text-align: center; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--card-border); background: rgba(10,15,40,0.6);
  }
  .main-header h1 { font-size: 20px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .main-content { flex: 1; overflow-y: auto; padding: 24px 32px; }

  /* 统计卡片 */
  .stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px; }
  .stat-card .stat-icon { font-size: 22px; margin-bottom: 10px; }
  .stat-card .stat-value { font-size: 28px; font-weight: 700; }
  .stat-card .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .stat-card .stat-change { font-size: 12px; margin-top: 6px; }
  .stat-card .stat-change.up { color: var(--accent-green); }
  .stat-card .stat-change.down { color: var(--risk-high); }

  /* 布局网格 */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 16px; }

  /* 卡片头 */
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-header h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card-header h3 i { color: var(--accent-cyan); font-size: 15px; }

  /* 表格 */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--card-border); font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  .data-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-dim); }
  .data-table tr:hover td { background: rgba(0,242,255,0.03); color: var(--text-main); }

  /* 状态点 */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .status-dot.green { background: var(--accent-green); }
  .status-dot.orange { background: var(--accent-orange); }
  .status-dot.red { background: var(--risk-high); }
  .status-dot.cyan { background: var(--accent-cyan); }

  /* 严重度标签 */
  .severity { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .severity.critical { background: rgba(239,68,68,0.18); color: var(--risk-high); }
  .severity.high { background: rgba(245,158,11,0.18); color: var(--accent-orange); }
  .severity.medium { background: rgba(0,242,255,0.12); color: var(--accent-cyan); }
  .severity.low { background: rgba(16,185,129,0.12); color: var(--accent-green); }

  /* 按钮组 */
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--card-border); background: transparent; color: var(--text-dim); transition: var(--transition); }
  .btn-sm:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
  .btn-sm.active { background: rgba(0,242,255,0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

  /* 图表容器 */
  .chart-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; }
  .chart-box h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }

  /* 预警条目 */
  .alert-item {
    padding: 14px; border-radius: var(--radius-sm); margin-top: 8px;
    border-left: 3px solid var(--risk-medium); background: rgba(255,255,255,0.02);
  }
  .alert-item.critical { border-left-color: var(--risk-high); background: rgba(239,68,68,0.06); }
  .alert-item.high { border-left-color: var(--accent-orange); background: rgba(245,158,11,0.04); }
  .alert-item .alert-title { font-weight: 600; margin-bottom: 4px; }
  .alert-item .alert-meta { font-size: 12px; color: var(--text-muted); }

  /* 响应卡片 */
  .response-card { margin-top: 12px; }
  .response-card textarea { min-height: 200px; font-family: 'SF Mono','Consolas',monospace; font-size: 13px; }

  .auth-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
  .auth-modal.active { display: flex; }
  .auth-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 32px; width: 400px; }

  /* 搜索弹窗 */
  .search-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5,8,22,0.95); z-index: 999; padding: 80px 32px 32px; overflow-y: auto; }
  .search-overlay.show { display: block; }
  .search-overlay .close-search { position: fixed; top: 24px; right: 32px; font-size: 24px; color: var(--text-dim); cursor: pointer; background: none; border: none; }
  .search-overlay .close-search:hover { color: var(--text-main); }
  .search-result-item { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
  .search-result-item:hover { background: rgba(0,242,255,0.04); }
  .search-result-item .platform-tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: rgba(0,242,255,0.1); color: var(--accent-cyan); margin-right: 8px; }

  @media (max-width: 1024px) {
    .stat-row { grid-template-columns: repeat(2,1fr); }
    .grid-2, .grid-3, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header"><h2><i class="fa-solid fa-building"></i> 知舆企业版</h2></div>

  <div class="main">

</div>

<div class="auth-modal" id="authModal">
  <div class="auth-box"><h3 class="mb-2">登录知舆企业版</h3>
    <form id="loginForm" onsubmit="doLogin(event)" style="display:flex;flex-direction:column;gap:12px">

    <button class="btn-secondary" onclick="document.getElementById('authModal').classList.remove('active')" style="width:100%;margin-top:8px">取消</button>

</div>

<script src="/web/shared/js/api-client.js"></script>
<script src="/web/shared/js/store.js"></script>
<script src="/web/shared/components/version-switcher.js"></script>
<script>

ZhiYuStore.init();
document.getElementById('authModal') && document.getElementById('authModal').remove();
document.getElementById('headerUser').innerHTML = '<i class="fa-solid fa-circle" style="font-size:6px;color:var(--accent-green);margin-right:4px"></i>企业管理员';
document.getElementById('versionBadge').textContent = '企业版';

const pageTitles = {
  dashboard:'监控大盘', alerts:'实时预警', monitor:'监测管理', spread:'传播追踪',
  competitor:'竞品监测', plan:'策划分析', response:'自动回应', reports:'报告中心',
  brand:'品牌管理', audit:'审计日志', settings:'设置'
};

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    navTo(item.dataset.page);
  });
});

let charts = {};
function navTo(pageId) {
  document.getElementById('pageTitle').textContent = pageTitles[pageId]||pageId;
  Object.values(charts).forEach(c=>{try{c.dispose()}catch(e){}});
  charts = {};
  renderPage(pageId);
}

function renderPage(pageId) {
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '';
  const pages = {dashboard:renderDashboard, alerts:renderAlerts, monitor:renderMonitor,
    spread:renderSpread, competitor:renderCompetitor, plan:renderPlan, response:renderResponse,
    reports:renderReports, brand:renderBrand, audit:renderAudit, settings:renderSettings};
  if (pages[pageId]) pages[pageId](mc);
}

// ============================== 监控大盘 ==============================
const DEMO = {
  brand: '知舆科技',
  mentions: 2847, mentionsChange: 12.5, mentionsUp: true,
  positiveRate: 68.3, positiveChange: 3.2,
  negativeCount: 187, negativeChange: -8.4, negativeUp: false,
  hotTopics: ['新品发布','用户体验','行业峰会','AI合作','融资消息','社会责任','技术突破','市场拓展'],

  trendValues: [42,38,55,210,380,295,420,280],
  sentimentData: [
    {name:'正面',value:1944,color:'#10b981'},
    {name:'中立',value:716,color:'#94a3b8'},
    {name:'负面',value:187,color:'#ef4444'}
  ],
  platformData: [
    {name:'微博',value:980},{name:'抖音',value:720},{name:'小红书',value:480},
    {name:'知乎',value:350},{name:'B站',value:210},{name:'快手',value:107}
  ],
  recentMentions: [
    {platform:'微博',title:'知舆科技新品发布会定档8月18日，AI舆情监测进入新阶段',time:'10分钟前',sentiment:'positive'},
    {platform:'抖音',title:'体验了知舆的企业版，监控大盘真的太直观了',time:'25分钟前',sentiment:'positive'},
    {platform:'知乎',title:'如何看待知舆科技最新一轮融资估值突破50亿？',time:'42分钟前',sentiment:'neutral'},
    {platform:'小红书',title:'品牌公关必备工具推荐：知舆舆情监测平台',time:'1小时前',sentiment:'positive'},
    {platform:'微博',title:'知舆平台出现短暂服务中断，官方回应正在修复',time:'2小时前',sentiment:'negative'},
    {platform:'B站',title:'深度测评知舆企业版vs竞品，功能全面对比',time:'3小时前',sentiment:'neutral'},
    {platform:'快手',title:'知舆AI自动回应功能帮我们节省了80%的公关响应时间',time:'4小时前',sentiment:'positive'},
    {platform:'微博',title:'知舆CEO接受专访：AI将重塑品牌舆情管理行业',time:'5小时前',sentiment:'positive'}
  ]
};

function renderDashboard(mc) {
  mc.innerHTML = '<div class="fade-in">'
    + '<div class="stat-row">'
    + '<div class="stat-card"><div class="stat-icon" style="color:var(--accent-cyan)"><i class="fa-solid fa-message"></i></div><div class="stat-value">2,847</div><div class="stat-label">品牌总声量</div><div class="stat-change up"><i class="fa-solid fa-arrow-up"></i> 12.5% 环比</div></div>'
    + '<div class="stat-card"><div class="stat-icon" style="color:var(--accent-green)"><i class="fa-solid fa-thumbs-up"></i></div><div class="stat-value">68.3%</div><div class="stat-label">正面情感占比</div><div class="stat-change up"><i class="fa-solid fa-arrow-up"></i> 3.2% 环比</div></div>'
    + '<div class="stat-card"><div class="stat-icon" style="color:var(--risk-high)"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="stat-value">187</div><div class="stat-label">负面预警数</div><div class="stat-change down"><i class="fa-solid fa-arrow-down"></i> 8.4% 环比</div></div>'
    + '<div class="stat-card"><div class="stat-icon" style="color:var(--accent-purple)"><i class="fa-solid fa-globe"></i></div><div class="stat-value">6</div><div class="stat-label">监测平台数</div><div class="stat-change" style="color:var(--text-muted)">全覆盖运行中</div></div>'
    + '</div>'
    + '<div class="grid-2">'
    + '<div class="chart-box"><h3><i class="fa-solid fa-chart-line"></i> 舆情热度趋势 (24h)</h3><div id="chartHeat" style="height:280px"></div></div>'
    + '<div class="chart-box"><h3><i class="fa-solid fa-chart-pie"></i> 情感分布</h3><div id="chartSentiment" style="height:280px"></div></div>'
    + '</div>'
    + '<div class="grid-3">'
    + '<div class="chart-box"><h3><i class="fa-solid fa-fire"></i> 平台声量分布</h3><div id="chartPlatform" style="height:240px"></div></div>'
    + '<div class="chart-box"><h3><i class="fa-solid fa-list"></i> 最新提及</h3><div id="recentMentions"></div></div>'
    + '<div class="chart-box"><h3><i class="fa-solid fa-tags"></i> 热点关键词</h3><div id="hotTopics"></div></div>'
    + '</div></div>';
  setTimeout(initDashboardCharts, 80);
}

function initDashboardCharts() {
  var hc = echarts.init(document.getElementById('chartHeat'));
  hc.setOption({
    tooltip:{trigger:'axis'}, grid:{left:45,right:20,top:10,bottom:25},
    xAxis:{type:'category',data:DEMO.trendLabels,axisLabel:{color:'#94a3b8',fontSize:10}},
    yAxis:{type:'value',axisLabel:{color:'#94a3b8'},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},
    series:[{data:DEMO.trendValues,type:'line',smooth:true,symbol:'circle',symbolSize:6,
      lineStyle:{color:'#8b5cf6',width:2},itemStyle:{color:'#8b5cf6'},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(139,92,246,0.3)'},{offset:1,color:'rgba(139,92,246,0.02)'}])}}]
  }); charts.heat = hc;

  var sc = echarts.init(document.getElementById('chartSentiment'));
  sc.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c} 条 ({d}%)'},
    legend:{bottom:0,textStyle:{color:'#94a3b8',fontSize:11}},
    series:[{type:'pie',radius:['45%','72%'],center:['50%','45%'],avoidLabelOverlap:false,
      itemStyle:{borderColor:'rgba(10,15,40,0.8)',borderWidth:3},
      label:{show:true,formatter:'{b}\n{d}%',color:'#94a3b8',fontSize:11},
      data:DEMO.sentimentData.map(function(d){return {value:d.value,name:d.name,itemStyle:{color:d.color}}})}]
  }); charts.sentiment = sc;

  var pc = echarts.init(document.getElementById('chartPlatform'));
  pc.setOption({
    tooltip:{trigger:'axis'}, grid:{left:60,right:20,top:10,bottom:20},
    xAxis:{type:'value',axisLabel:{color:'#94a3b8'},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},
    yAxis:{type:'category',data:DEMO.platformData.map(function(d){return d.name}).reverse(),axisLabel:{color:'#94a3b8',fontSize:11},inverse:false},
    series:[{data:DEMO.platformData.map(function(d){return d.value}).reverse(),type:'bar',
      barMaxWidth:18,label:{show:true,position:'right',color:'#94a3b8',fontSize:10},
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#00f2ff'},{offset:1,color:'#8b5cf6'}])}}]
  }); charts.platform = pc;

  document.getElementById('recentMentions').innerHTML = DEMO.recentMentions.slice(0,6).map(function(m){
    var cls = m.sentiment==='negative'?'high':(m.sentiment==='positive'?'':'');
    var icon = m.sentiment==='positive'?'trending-up':(m.sentiment==='negative'?'trending-down':'minus');
    return '<div class="alert-item'+(cls?' '+cls:'')+'"><div class="alert-title"><i class="fa-solid fa-'+icon+'" style="font-size:11px;margin-right:4px;color:'+(m.sentiment==='negative'?'var(--risk-high)':m.sentiment==='positive'?'var(--accent-green)':'var(--text-muted)')+'"></i>'+m.title+'</div><div class="alert-meta"><span class="tag" style="margin-right:6px">'+m.platform+'</span>'+m.time+'</div></div>';
  }).join('');

  document.getElementById('hotTopics').innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'
    + DEMO.hotTopics.map(function(t,i){
        var colors = ['#00f2ff','#8b5cf6','#10b981','#f59e0b','#3b82f6','#ef4444','#ec4899','#14b8a6'];
        return '<span class="tag" style="font-size:'+(16-(i*0.8))+'px;padding:6px 14px;color:'+colors[i]+';background:'+colors[i]+'22;border:1px solid '+colors[i]+'44">'+t+'</span>';
      }).join('')+'</div>';
}

// ============================== 实时预警 ==============================
var alertRules = [

}

function saveAlertRule() {
  var name = document.getElementById('newRuleName').value.trim();
  var kw = document.getElementById('newRuleKw').value.trim();
  var th = parseInt(document.getElementById('newRuleTh').value)||30;
  if (!name||!kw) return alert('请填写规则名称和关键词');
  alertRules.push({id:Date.now(),name:name,keywords:kw.split(',').map(function(k){return k.trim()}),threshold:th,platforms:['微博','抖音','小红书'],enabled:true});
  document.getElementById('alertRuleForm').style.display = 'none';
  renderAlerts(document.getElementById('mainContent'));
  showToast('预警规则已保存','success');
}

function toggleAlertRule(id) {
  var r = alertRules.find(function(a){return a.id===id;});
  if (r) { r.enabled = !r.enabled; renderAlerts(document.getElementById('mainContent')); }
}

function deleteAlertRule(id) {
  alertRules = alertRules.filter(function(a){return a.id!==id;});
  renderAlerts(document.getElementById('mainContent'));
  showToast('规则已删除','info');
}

function switchToPersonal() {
  try { ZhiYuStore.switchVersion('personal'); } catch(e) {}
  window.location.href = '/';
}

function doLogin(e) {
  e.preventDefault();
  try {
    fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('lId').value,password:document.getElementById('lPw').value})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}});})
      .then(function(r){if(!r.ok)throw new Error(r.d.detail);return r.d;})
      .then(function(d){return fetch('/auth/me',{headers:{'Authorization':'Bearer '+d.access_token}}).then(function(r){return r.json();}).then(function(me){ZhiYuStore.setToken(d.access_token,me);return me;});})
      .then(function(me){document.getElementById('authModal').classList.remove('active');document.getElementById('headerUser').textContent=me.username;if(me.user_type!=='enterprise')ZhiYuStore.switchVersion('enterprise');navTo('dashboard');})
      .catch(function(e){alert('登录失败: '+e.message);});
  } catch(e) { alert('登录失败: '+e.message); }
}

function logout() { try{ZhiYuStore.logout();}catch(e){} window.location.href='/'; }

function showToast(msg,type) {
  var container = document.querySelector('.toast-container');
  if (!container) { container = document.createElement('div'); container.className = 'toast-container'; document.body.appendChild(container); }
  var toast = document.createElement('div'); toast.className = 'toast '+(type||'info'); toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function(){ toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(function(){toast.remove();},300); }, 2500);
}

function mockSearch() {

  }
  overlay.classList.add('show');

  // 根据搜索词过滤结果，同时生成一些动态假数据
  var results = mockSearchData.filter(function(item){
    return item.title.indexOf(query)>=0 || item.platform.indexOf(query)>=0;
  });

  // 如果没匹配到，生成包含搜索词的假数据
  if (results.length === 0) {

      {platform:'微博',title:'"'+query+'"引发的争议仍在发酵',sentiment:'negative',time:'3小时前',url:'#'}
    ];
  }

  var html = '<p class="text-dim mb-2">找到 <strong style="color:var(--accent-cyan)">'+results.length+'</strong> 条相关结果（模拟数据）</p>';
  results.forEach(function(r){
    var sIcon = r.sentiment==='positive'?'<i class="fa-solid fa-circle" style="color:var(--accent-green);font-size:8px;margin-right:4px"></i>':(r.sentiment==='negative'?'<i class="fa-solid fa-circle" style="color:var(--risk-high);font-size:8px;margin-right:4px"></i>':'<i class="fa-solid fa-circle" style="color:var(--text-muted);font-size:8px;margin-right:4px"></i>');
